<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel Administrativo - Franquias | Chopp ON</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{
      --brand:#ffb400;
      --brand-dark:#0e0e0e;
    }
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial,'Noto Sans',sans-serif;background:#f8f9fa;color:#222;}
    .navbar{box-shadow:0 8px 30px rgba(0,0,0,.06); background:#fff;}
    .navbar-brand{font-weight:800; letter-spacing:.5px;}
    .container-main{max-width:1400px; margin:40px auto; padding:0 20px;}
    .card{border:none; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); margin-bottom:20px;}
    .card-header{background:var(--brand); color:#000; font-weight:700; border-radius:12px 12px 0 0!important;}
    .badge{padding:.5rem .8rem; border-radius:6px;}
    .table{margin-bottom:0;}
    .table th{background:#f8f9fa; font-weight:700; border-bottom:2px solid #dee2e6;}
    .btn-brand{background:var(--brand); border:none; color:#000; font-weight:700;}
    .btn-brand:hover{filter:brightness(.95); color:#000;}
    .stats-card{background:#fff; padding:20px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); text-align:center;}
    .stats-number{font-size:2.5rem; font-weight:900; color:var(--brand);}
    .stats-label{color:#666; font-size:.9rem; text-transform:uppercase; letter-spacing:.5px;}
    .detail-row{background:#f8f9fa; padding:10px; border-radius:6px; margin-bottom:8px;}
    .detail-label{font-weight:700; color:#333;}
    .no-data{text-align:center; padding:60px 20px; color:#999;}
    .filter-section{background:#fff; padding:20px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); margin-bottom:20px;}
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container py-2">
      <a class="navbar-brand d-flex align-items-center" href="../index.html">
        <span class="me-2" style="font-size:1.6rem">🍺</span> Chopp ON - Admin
      </a>
      <div class="ms-auto">
        <a href="../index.html" class="btn btn-outline-dark">Voltar ao Site</a>
      </div>
    </div>
  </nav>

  <div class="container-main">
    <h1 class="mb-4">Painel de Franquias</h1>
    
    <!-- Estatísticas -->
    <div class="row mb-4">
      <div class="col-md-3">
        <div class="stats-card">
          <div class="stats-number" id="totalCadastros">0</div>
          <div class="stats-label">Total de Cadastros</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stats-card">
          <div class="stats-number" id="cadastrosHoje">0</div>
          <div class="stats-label">Hoje</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stats-card">
          <div class="stats-number" id="cadastrosSemana">0</div>
          <div class="stats-label">Esta Semana</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stats-card">
          <div class="stats-number" id="cadastrosMes">0</div>
          <div class="stats-label">Este Mês</div>
        </div>
      </div>
    </div>

    <!-- Filtros -->
    <div class="filter-section">
      <div class="row">
        <div class="col-md-3">
          <label class="form-label">Filtrar por Estado</label>
          <select class="form-select" id="filterEstado" onchange="applyFilters()">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Filtrar por Capital</label>
          <select class="form-select" id="filterCapital" onchange="applyFilters()">
            <option value="">Todos</option>
            <option value="ate_50k">Até R$ 50k</option>
            <option value="50k_100k">R$ 50k a R$ 100k</option>
            <option value="100k_200k">R$ 100k a R$ 200k</option>
            <option value="200k_300k">R$ 200k a R$ 300k</option>
            <option value="acima_300k">Acima de R$ 300k</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Buscar por Nome</label>
          <input type="text" class="form-control" id="searchNome" onkeyup="applyFilters()" placeholder="Digite o nome...">
        </div>
        <div class="col-md-3">
          <label class="form-label">Ordenar por</label>
          <select class="form-select" id="sortBy" onchange="applyFilters()">
            <option value="recent">Mais Recentes</option>
            <option value="oldest">Mais Antigos</option>
            <option value="name">Nome A-Z</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Lista de Cadastros -->
    <div id="cadastrosList"></div>
    
    <div class="no-data" id="noData" style="display:none;">
      <h3>Nenhum cadastro encontrado</h3>
      <p>Aguardando novos interessados em franquia.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let allData = [];
    let filteredData = [];

    // Carregar dados
    async function loadData() {
      try {
        const response = await fetch('get-franchise-data.php');
        const data = await response.json();
        allData = data;
        filteredData = data;
        
        updateStats();
        populateFilters();
        renderCadastros();
      } catch (error) {
        console.error('Erro ao carregar dados:', error);
        document.getElementById('noData').style.display = 'block';
      }
    }

    // Atualizar estatísticas
    function updateStats() {
      const now = new Date();
      const today = now.toISOString().split('T')[0];
      const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
      const monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);

      const cadastrosHoje = allData.filter(d => d.timestamp.split(' ')[0] === today).length;
      const cadastrosSemana = allData.filter(d => new Date(d.timestamp) >= weekAgo).length;
      const cadastrosMes = allData.filter(d => new Date(d.timestamp) >= monthAgo).length;

      document.getElementById('totalCadastros').textContent = allData.length;
      document.getElementById('cadastrosHoje').textContent = cadastrosHoje;
      document.getElementById('cadastrosSemana').textContent = cadastrosSemana;
      document.getElementById('cadastrosMes').textContent = cadastrosMes;
    }

    // Popular filtros
    function populateFilters() {
      const estados = [...new Set(allData.map(d => d.interesse_franquia.estado_interesse))].sort();
      const filterEstado = document.getElementById('filterEstado');
      estados.forEach(estado => {
        if (estado) {
          const option = document.createElement('option');
          option.value = estado;
          option.textContent = estado;
          filterEstado.appendChild(option);
        }
      });
    }

    // Aplicar filtros
    function applyFilters() {
      const filterEstado = document.getElementById('filterEstado').value;
      const filterCapital = document.getElementById('filterCapital').value;
      const searchNome = document.getElementById('searchNome').value.toLowerCase();
      const sortBy = document.getElementById('sortBy').value;

      filteredData = allData.filter(d => {
        const matchEstado = !filterEstado || d.interesse_franquia.estado_interesse === filterEstado;
        const matchCapital = !filterCapital || d.capacidade_investimento.capital_disponivel === filterCapital;
        const matchNome = !searchNome || d.dados_pessoais.nome.toLowerCase().includes(searchNome);
        return matchEstado && matchCapital && matchNome;
      });

      // Ordenar
      if (sortBy === 'recent') {
        filteredData.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      } else if (sortBy === 'oldest') {
        filteredData.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
      } else if (sortBy === 'name') {
        filteredData.sort((a, b) => a.dados_pessoais.nome.localeCompare(b.dados_pessoais.nome));
      }

      renderCadastros();
    }

    // Renderizar cadastros
    function renderCadastros() {
      const container = document.getElementById('cadastrosList');
      const noData = document.getElementById('noData');

      if (filteredData.length === 0) {
        container.innerHTML = '';
        noData.style.display = 'block';
        return;
      }

      noData.style.display = 'none';
      container.innerHTML = filteredData.map((cadastro, index) => {
        const capitalLabels = {
          'ate_50k': 'Até R$ 50.000',
          '50k_100k': 'R$ 50.000 a R$ 100.000',
          '100k_200k': 'R$ 100.000 a R$ 200.000',
          '200k_300k': 'R$ 200.000 a R$ 300.000',
          'acima_300k': 'Acima de R$ 300.000'
        };

        const prazoLabels = {
          'imediato': 'Imediato (até 30 dias)',
          '1_3_meses': '1 a 3 meses',
          '3_6_meses': '3 a 6 meses',
          '6_12_meses': '6 a 12 meses',
          'acima_12_meses': 'Acima de 12 meses'
        };

        return `
          <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
              <div>
                <strong>#${allData.length - allData.indexOf(cadastro)}</strong> - ${cadastro.dados_pessoais.nome}
              </div>
              <div>
                <span class="badge bg-dark">${new Date(cadastro.timestamp).toLocaleDateString('pt-BR')}</span>
              </div>
            </div>
            <div class="card-body">
              <div class="row">
                <div class="col-md-6">
                  <h6 class="text-uppercase text-muted mb-3">Dados Pessoais</h6>
                  <div class="detail-row">
                    <span class="detail-label">E-mail:</span> ${cadastro.dados_pessoais.email}
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Telefone:</span> ${cadastro.dados_pessoais.telefone}
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Idade:</span> ${cadastro.dados_pessoais.idade} anos
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">CPF:</span> ${cadastro.dados_pessoais.cpf}
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Localização:</span> ${cadastro.dados_pessoais.cidade}/${cadastro.dados_pessoais.estado}
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Formação:</span> ${cadastro.perfil_profissional.formacao}
                  </div>

                  <h6 class="text-uppercase text-muted mb-3 mt-4">Interesse na Franquia</h6>
                  <div class="detail-row">
                    <span class="detail-label">Local desejado:</span> ${cadastro.interesse_franquia.cidade_interesse}/${cadastro.interesse_franquia.estado_interesse}
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Bairro:</span> ${cadastro.interesse_franquia.bairro_interesse}
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Tipo de local:</span> ${cadastro.interesse_franquia.tipo_local}
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Possui ponto:</span> ${cadastro.interesse_franquia.ja_possui_ponto}
                  </div>
                  ${cadastro.interesse_franquia.detalhes_ponto ? `
                  <div class="detail-row">
                    <span class="detail-label">Detalhes do ponto:</span> ${cadastro.interesse_franquia.detalhes_ponto}
                  </div>
                  ` : ''}
                </div>

                <div class="col-md-6">
                  <h6 class="text-uppercase text-muted mb-3">Perfil Profissional</h6>
                  <div class="detail-row">
                    <span class="detail-label">Resumo:</span><br>${cadastro.perfil_profissional.resumo_perfil}
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Experiências:</span><br>${cadastro.perfil_profissional.experiencias_anteriores}
                  </div>

                  <h6 class="text-uppercase text-muted mb-3 mt-4">Experiência em Negócios</h6>
                  <div class="detail-row">
                    <span class="detail-label">Motivo bebidas:</span><br>${cadastro.experiencia_negocios.motivo_bebidas}
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Experiência em bebidas:</span> ${cadastro.experiencia_negocios.experiencia_bebidas}
                  </div>
                  ${cadastro.experiencia_negocios.detalhes_bebidas ? `
                  <div class="detail-row">
                    <span class="detail-label">Detalhes:</span><br>${cadastro.experiencia_negocios.detalhes_bebidas}
                  </div>
                  ` : ''}
                  <div class="detail-row">
                    <span class="detail-label">Experiência em franquia:</span> ${cadastro.experiencia_negocios.experiencia_franquia}
                  </div>
                  ${cadastro.experiencia_negocios.detalhes_franquia ? `
                  <div class="detail-row">
                    <span class="detail-label">Franquias anteriores:</span><br>${cadastro.experiencia_negocios.detalhes_franquia}
                  </div>
                  ` : ''}
                  <div class="detail-row">
                    <span class="detail-label">Possui empresas:</span> ${cadastro.experiencia_negocios.possui_empresas}
                  </div>
                  ${cadastro.experiencia_negocios.lista_empresas ? `
                  <div class="detail-row">
                    <span class="detail-label">Empresas:</span><br>${cadastro.experiencia_negocios.lista_empresas.replace(/\n/g, '<br>')}
                  </div>
                  ` : ''}

                  <h6 class="text-uppercase text-muted mb-3 mt-4">Capacidade de Investimento</h6>
                  <div class="detail-row">
                    <span class="detail-label">Capital disponível:</span> ${capitalLabels[cadastro.capacidade_investimento.capital_disponivel] || cadastro.capacidade_investimento.capital_disponivel}
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Prazo implantação:</span> ${prazoLabels[cadastro.capacidade_investimento.prazo_implantacao] || cadastro.capacidade_investimento.prazo_implantacao}
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Dedicação:</span> ${cadastro.capacidade_investimento.dedicacao}
                  </div>

                  <h6 class="text-uppercase text-muted mb-3 mt-4">Informações Adicionais</h6>
                  <div class="detail-row">
                    <span class="detail-label">Como conheceu:</span> ${cadastro.informacoes_adicionais.como_conheceu}
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Expectativas:</span><br>${cadastro.informacoes_adicionais.expectativas}
                  </div>
                  ${cadastro.informacoes_adicionais.observacoes ? `
                  <div class="detail-row">
                    <span class="detail-label">Observações:</span><br>${cadastro.informacoes_adicionais.observacoes}
                  </div>
                  ` : ''}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Carregar dados ao iniciar
    loadData();

    // Atualizar a cada 30 segundos
    setInterval(loadData, 30000);
  </script>
</body>
</html>
