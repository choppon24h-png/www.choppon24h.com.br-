<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixar Choppon App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .download-btn {
            background-color: #007bff;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin: 20px 0;
            transition: background-color 0.3s;
        }
        .download-btn:hover {
            background-color: #0056b3;
        }
        .info-box {
            background-color: #f8f9fa;
            border-left: 4px solid #007bff;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>🛒 Choppon App</h1>
    <p>Baixe a versão mais recente do aplicativo Choppon</p>
    
    <div class="info-box">
        <strong>Instruções de instalação:</strong>
        <ol>
            <li>Clique no botão abaixo para baixar o APK</li>
            <li>Permita a instalação de fontes desconhecidas nas configurações do seu Android</li>
            <li>Localize o arquivo baixado e instale-o</li>
        </ol>
    </div>
    
    <button class="download-btn" onclick="downloadAPK()">
        📥 Baixar Choppon v1.0
    </button>
    
    <div id="downloadStatus"></div>

    <script>
        function downloadAPK() {
            const apkUrl = 'chopponv1.apk';
            const link = document.createElement('a');
            link.href = apkUrl;
            link.download = 'Choppon-App-v1.0.apk';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // Mostrar status
            document.getElementById('downloadStatus').innerHTML = 
                '<p style="color: green;">Download iniciado! Verifique sua barra de notificações.</p>';
            
            // Forçar download após 2 segundos se não iniciou
            setTimeout(function() {
                window.location.href = apkUrl;
            }, 2000);
        }
    </script>
</body>
</html>
